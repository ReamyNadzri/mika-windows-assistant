[project]
name = "hermes-personal-deployment"
version = "0.1.0"
description = "Owner-only Windows personal assistant plugin for Nous Hermes Agent"
requires-python = ">=3.11"
dependencies = ["Pillow>=11", "matplotlib>=3.9", "Send2Trash>=1.8", "PyYAML>=6", "psutil>=6"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
